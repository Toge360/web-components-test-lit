<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Svelte Web Component Demo</title>
    <script type="module" crossorigin src="/assets/index-36RNcpRb.js"></script>
  </head>
  <body>
    <h1>Svelte Web Component Demo</h1>

    <div
      style="display: flex; gap: 2rem; align-items: flex-start; flex-wrap: wrap"
    >
      <div>
        <h2>Button Component</h2>
        <my-svelte-button text="Svelte Button" count="0"></my-svelte-button>
      </div>

      <div>
        <h2>Form Component</h2>
        <my-base-form title="Sign Up Today"></my-base-form>
      </div>
    </div>


    <script>
      // Listen for custom events on button
      const btn = document.querySelector("my-svelte-button");
      if (btn) {
        btn.addEventListener("click", (e) => {
          console.log("Custom event received from Button:", e.detail);
        });
      }

      // Listen for custom events on form
      const form = document.querySelector("my-base-form");
      if (form) {
        form.addEventListener("form-submit", (e) => {
          console.log("Custom event received from Form:", e.detail);
          alert(
            `Form Submitted!\nName: ${e.detail.name}\nEmail: ${e.detail.email}`,
          );
        });
      }
    </script>
  </body>
</html>
